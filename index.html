<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171b">
<title>Pipe Dream</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pipe Dream">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: one phone-width column over a charcoal field with soft colour blobs; frosted glass cards; tracker tabs on top, bottom nav for pages, sheets slide up. */
:root {
  --bg: #15171b; --glass: rgba(255,255,255,.055); --glass-2: rgba(255,255,255,.09); --stroke: rgba(255,255,255,.10);
  --fg: #f2f4f7; --muted: #949ba7; --win: #39ff88; --loss: #ff3b5c; --pend: #ffc93c; --gold: #ffc93c;
  --blob1: rgba(57,255,136,.10); --blob2: rgba(58,214,255,.09); --blob3: rgba(255,59,92,.06);
  --track: rgba(255,255,255,.07); --scrim: rgba(5,6,8,.62); --navbg: rgba(24,26,31,.78); --sheet: rgba(30,33,39,.94); --field: rgba(0,0,0,.28);
  --accent: #3ad6ff; --on-accent: #0b0e12;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 64px;
  color-scheme: dark;
}
:root[data-skin="light"] {
  --bg: #eceff4; --glass: rgba(255,255,255,.62); --glass-2: rgba(255,255,255,.88); --stroke: rgba(20,30,50,.11);
  --fg: #12151a; --muted: #5b6473; --win: #0fae5a; --loss: #e0263f; --pend: #b97f00; --gold: #b98a00;
  --blob1: rgba(15,174,90,.13); --blob2: rgba(58,150,255,.13); --blob3: rgba(224,38,63,.07);
  --track: rgba(20,30,50,.08); --scrim: rgba(20,24,30,.38); --navbg: rgba(255,255,255,.8); --sheet: rgba(250,251,253,.96); --field: rgba(255,255,255,.9);
  color-scheme: light;
}
:root[data-skin="wolf"] { --bg: #0d1118; --blob1: rgba(140,170,255,.13); --blob2: rgba(210,225,255,.10); --blob3: rgba(109,140,255,.08); --navbg: rgba(16,21,32,.82); --sheet: rgba(20,26,40,.96); --glass: rgba(190,210,255,.06); --stroke: rgba(190,210,255,.14); --muted: #97a3bd; }
:root[data-skin="unstoppable"] { --bg: #160a0c; --blob1: rgba(255,45,85,.16); --blob2: rgba(255,200,60,.13); --blob3: rgba(255,90,31,.10); --navbg: rgba(30,12,14,.82); --sheet: rgba(36,14,17,.96); --glass: rgba(255,170,150,.06); --stroke: rgba(255,170,140,.15); --muted: #c09a95; }
:root[data-skin="comet"] { --bg: #0a1024; --blob1: rgba(90,210,255,.16); --blob2: rgba(91,108,255,.18); --blob3: rgba(255,255,255,.04); --navbg: rgba(12,18,40,.8); --sheet: rgba(16,24,50,.95); --glass: rgba(140,180,255,.07); --stroke: rgba(160,200,255,.14); --muted: #93a3c7; }
:root[data-skin="legend"] { --bg: #0e0c08; --gold: #ffd24a; --blob1: rgba(255,200,60,.14); --blob2: rgba(180,120,20,.12); --blob3: rgba(255,240,200,.04); --navbg: rgba(20,17,10,.82); --sheet: rgba(28,24,14,.96); --glass: rgba(255,220,140,.06); --stroke: rgba(255,210,120,.16); --muted: #b3a483; }
:root[data-skin="immortal"] { --bg: #0c0716; --blob1: rgba(255,95,210,.14); --blob2: rgba(106,60,255,.2); --blob3: rgba(58,214,255,.1); --navbg: rgba(18,10,32,.8); --sheet: rgba(24,14,40,.95); --glass: rgba(200,160,255,.07); --stroke: rgba(210,170,255,.15); --muted: #a99bc4; }
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bgfx { position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
  radial-gradient(40vmax 40vmax at 85% 8%, var(--blob2), transparent 70%),
  radial-gradient(45vmax 45vmax at 5% 45%, var(--blob1), transparent 70%),
  radial-gradient(40vmax 40vmax at 80% 95%, var(--blob3), transparent 70%), var(--bg); }
:root { --rim: rgba(255,255,255,.07); --lift: 0 14px 34px -20px rgba(0,0,0,.75); }
:root[data-skin="light"] { --rim: rgba(255,255,255,.95); --lift: 0 12px 28px -18px rgba(20,30,50,.28); }
:root[data-skin="wolf"] { --track: rgba(190,210,255,.09); --rim: rgba(200,220,255,.14); }
:root[data-skin="unstoppable"] { --track: rgba(255,150,120,.09); --rim: rgba(255,170,120,.16); }
:root[data-skin="comet"] { --track: rgba(150,210,255,.09); --rim: rgba(150,220,255,.16); }
:root[data-skin="legend"] { --track: rgba(255,210,120,.1); --rim: rgba(255,214,120,.24); }
:root[data-skin="immortal"] { --track: rgba(220,170,255,.1); --rim: rgba(230,180,255,.2); }

/* Theme scenery: each theme paints its own ambient layers behind the app on .bgfx::before/::after. */
.bgfx::before, .bgfx::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
/* Charcoal and Light: a faint instrument-panel dot grid that fades out down the page */
.bgfx::before { background: radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1.4px) 0 0 / 22px 22px; -webkit-mask: linear-gradient(#000, transparent 70%); mask: linear-gradient(#000, transparent 70%); }
:root[data-skin="light"] .bgfx::before { background-image: radial-gradient(circle, rgba(20,30,50,.07) 1px, transparent 1.4px); }
/* Wolf: moonlit night with cold moonlight from the top corner, sparse twinkling stars and low mist */
:root[data-skin="wolf"] .bgfx::before { -webkit-mask: none; mask: none; background:
  radial-gradient(1.3px 1.3px at 14% 22%, #fff, transparent), radial-gradient(1px 1px at 63% 12%, #dfe8ff, transparent),
  radial-gradient(1.2px 1.2px at 37% 41%, #fff, transparent), radial-gradient(1px 1px at 82% 57%, #cfdcff, transparent),
  radial-gradient(1.4px 1.4px at 8% 73%, #fff, transparent), radial-gradient(1px 1px at 51% 84%, #dfe8ff, transparent) 0 0 / 260px 260px;
  animation: twinkle 5s ease-in-out infinite; }
:root[data-skin="wolf"] .bgfx::after { background:
  radial-gradient(60vmax 40vmax at 100% 0%, rgba(214,226,255,.2), rgba(160,185,255,.06) 50%, transparent 75%),
  linear-gradient(to top, rgba(150,175,230,.13), transparent 28%); }
/* Unstoppable: molten heat rising from the bottom with embers drifting up */
:root[data-skin="unstoppable"] .bgfx::before { -webkit-mask: none; mask: none; background: radial-gradient(130% 55% at 50% 112%, rgba(255,70,30,.42), rgba(255,40,70,.12) 55%, transparent 75%); animation: heat 3.2s ease-in-out infinite; }
:root[data-skin="unstoppable"] .bgfx::after { background:
  radial-gradient(3px 3px at 20% 30%, #ffb35c, transparent), radial-gradient(2.5px 2.5px at 70% 60%, #ff7a2f, transparent),
  radial-gradient(3.5px 3.5px at 45% 85%, #ffd36b, transparent), radial-gradient(2.5px 2.5px at 90% 15%, #ff5a1f, transparent),
  radial-gradient(2px 2px at 8% 70%, #ffe08a, transparent);
  background-size: 170px 240px; -webkit-mask: linear-gradient(transparent, #000 70%); mask: linear-gradient(transparent 10%, #000 80%); animation: embers 7s linear infinite; }
/* Comet: deep space starfield drifting slowly, with a comet streaking across every so often */
:root[data-skin="comet"] .bgfx::before { -webkit-mask: none; mask: none; background:
  radial-gradient(1px 1px at 10% 20%, #fff, transparent), radial-gradient(1.4px 1.4px at 30% 70%, #bfe9ff, transparent),
  radial-gradient(1px 1px at 55% 35%, #fff, transparent), radial-gradient(1.2px 1.2px at 75% 85%, #e2eaff, transparent),
  radial-gradient(1px 1px at 90% 50%, #fff, transparent), radial-gradient(1.6px 1.6px at 45% 95%, #9be8ff, transparent);
  background-size: 190px 190px; animation: drift 90s linear infinite; }
:root[data-skin="comet"] .bgfx::after { inset: auto; top: 16%; left: -40%; width: 260px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(155,232,255,.7), #fff); box-shadow: 0 0 12px 2px rgba(90,210,255,.6); transform: rotate(-16deg); opacity: 0; animation: comet 11s ease-in 2s infinite; }
/* Legend: black and gold with fine pinstripes and a warm spotlight from above */
:root[data-skin="legend"] .bgfx::before { -webkit-mask: none; mask: none; background: repeating-linear-gradient(135deg, rgba(255,210,120,.035) 0 1px, transparent 1px 13px); }
:root[data-skin="legend"] .bgfx::after { background: radial-gradient(70% 45% at 50% -8%, rgba(255,205,90,.22), transparent 70%); }
:root[data-skin="legend"] .glass { background: linear-gradient(110deg, transparent 40%, rgba(255,220,140,.08) 50%, transparent 60%) 0 0 / 260% 100%, var(--glass); animation: sheen 7s ease-in-out infinite; }
/* Immortal: a slowly turning nebula with twinkling stars and shimmering cards */
:root[data-skin="immortal"] .bgfx::before { -webkit-mask: none; mask: none; inset: -40%; background: conic-gradient(from 0deg, rgba(255,95,210,.2), rgba(106,60,255,.26), rgba(58,214,255,.16), rgba(255,95,210,.2)); filter: blur(70px); animation: reSpin 60s linear infinite; }
:root[data-skin="immortal"] .bgfx::after { background:
  radial-gradient(1.2px 1.2px at 15% 25%, #fff, transparent), radial-gradient(1px 1px at 65% 15%, #ffd6f5, transparent),
  radial-gradient(1.4px 1.4px at 40% 60%, #fff, transparent), radial-gradient(1px 1px at 85% 75%, #c9f3ff, transparent) 0 0 / 210px 210px;
  animation: twinkle 4s ease-in-out infinite; }
:root[data-skin="immortal"] .glass { background: linear-gradient(110deg, transparent 38%, rgba(255,150,240,.07) 46%, rgba(120,220,255,.07) 54%, transparent 62%) 0 0 / 260% 100%, var(--glass); animation: sheen 9s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .45; } }
@keyframes heat { 50% { opacity: .7; transform: scaleY(1.06); } }
@keyframes embers { to { background-position: 30px -240px; } }
@keyframes drift { to { background-position: -190px 190px; } }
@keyframes comet { 0% { opacity: 0; transform: translate(0, 0) rotate(-16deg); } 4% { opacity: 1; } 16% { opacity: 0; transform: translate(170vw, -48vw) rotate(-16deg); } 100% { opacity: 0; transform: translate(170vw, -48vw) rotate(-16deg); } }
@keyframes sheen { 0%, 100% { background-position: 100% 0, 0 0; } 50% { background-position: 0% 0, 0 0; } }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--nav-h) + 110px + env(safe-area-inset-bottom, 0px)); }
.glass { background: var(--glass); border: 1px solid var(--stroke); border-radius: 18px; box-shadow: inset 0 1px 0 var(--rim), var(--lift); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); }

/* Tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 6px; align-items: center; padding: 12px 4px 10px; margin-inline: -4px; overflow-x: auto; scrollbar-width: none; background: linear-gradient(var(--bg) 70%, transparent); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--stroke); background: var(--glass); border-radius: 999px; padding: 7px 14px; font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .02em; white-space: nowrap; display: flex; gap: 6px; align-items: center; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.tab.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; }

/* Headers */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; }
.head h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: .01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eyebrow { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ghost { border: 1px solid var(--stroke); background: var(--glass); border-radius: 12px; padding: 8px 13px; font-size: 13px; font-weight: 600; flex: none; }

/* Tier badge */
.tsym { position: relative; display: inline-block; line-height: 1; }
.tsym.has { margin-right: 11px; }
.tcount { position: absolute; top: -.45em; left: calc(100% - 6px); min-width: 15px; height: 15px; padding: 0 4px; border-radius: 99px; background: var(--fg); color: var(--bg); font: 800 10px/15px var(--body); letter-spacing: 0; text-align: center; box-shadow: 0 0 0 2px var(--bg); text-transform: none; }
.tb { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--stroke); white-space: nowrap; color: var(--fg); }
.tb.glow { border-color: var(--tc); box-shadow: 0 0 12px -2px var(--tc), inset 0 0 8px -4px var(--tc); }
.tb.flame { border-color: transparent; color: #1a0a00; background: linear-gradient(100deg, var(--tc2), var(--tc), #ffe08a, var(--tc)); background-size: 300% 100%; animation: flameBg 2.2s linear infinite; box-shadow: 0 0 16px -2px var(--tc); }
.tb.cosmic { border-color: transparent; color: #fff; background: linear-gradient(100deg, #1b0b3a, var(--tc2), var(--tc), #3ad6ff, #1b0b3a); background-size: 400% 100%; animation: flameBg 5s linear infinite; box-shadow: 0 0 20px -2px var(--tc); text-shadow: 0 0 6px rgba(255,255,255,.7); }
@keyframes flameBg { to { background-position: 300% 0; } }

/* Ring */
.ring-wrap { position: relative; width: min(80vw, 330px); aspect-ratio: 1; max-width: 100%; margin: 10px auto 4px; --glow: 0px; }
.ring-canvas { position: absolute; inset: -22%; width: 144%; height: 144%; pointer-events: none; }
.ring-wrap > svg { position: relative; width: 100%; height: 100%; display: block; overflow: visible; }
.ring-arc { transition: stroke-dashoffset .9s cubic-bezier(.2,.9,.25,1); }
.ring-glow { opacity: .8; }
.ring-head { transform-box: view-box; transform-origin: 120px 120px; transition: transform .9s cubic-bezier(.2,.9,.25,1), opacity .4s; }
.re-spin { transform-box: view-box; transform-origin: 120px 120px; animation: reSpin 14s linear infinite; }
.tier-arc { filter: drop-shadow(0 0 3px currentColor); animation: tierIn 1.1s cubic-bezier(.2,.9,.25,1) both; }
@keyframes tierIn { from { stroke-dashoffset: var(--tc); } }
.tier-mark { animation: tierMark .5s .8s both; }
@keyframes tierMark { from { opacity: 0; } }
.re-flow { animation: reFlow 2.4s linear infinite; }
@keyframes reFlow { to { stroke-dashoffset: -105; } }
.re-flare { transform-box: view-box; animation: reFlare 3s linear infinite; }
@keyframes reFlare { 0% { transform: rotate(0) scale(.85); } 50% { transform: rotate(45deg) scale(1.15); } 100% { transform: rotate(90deg) scale(.85); } }
.shock { opacity: 0; transform-box: view-box; transform-origin: 120px 120px; pointer-events: none; }
.ring-wrap.surge .shock, .ring-wrap.surge-big .shock { animation: shock .9s ease-out; }
@keyframes shock { 0% { opacity: .9; transform: scale(1); stroke-width: 6; } 100% { opacity: 0; transform: scale(1.22); stroke-width: .5; } }
.re-spin.rev { animation-duration: 9s; animation-direction: reverse; }
.re-core { transform-box: view-box; transform-origin: 120px 120px; animation: reBreathe 2.6s ease-in-out infinite; }
@keyframes reSpin { to { transform: rotate(360deg); } }
@keyframes reBreathe { 50% { opacity: .55; transform: scale(.96); } }
.ring-wrap.pulse .ring-glow { animation: glowPulse 2.4s ease-in-out infinite; }
.ring-wrap.gold .ring-glow { animation: glowPulse 1.4s ease-in-out infinite; }
.ring-wrap.paused { filter: grayscale(.85) brightness(.75); }
@keyframes glowPulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
.ring-wrap.surge { animation: surge .9s cubic-bezier(.2,.9,.25,1); }
.ring-wrap.surge-big { animation: surgeBig 1.4s cubic-bezier(.2,.9,.25,1); }
@keyframes surge { 35% { transform: scale(1.07); filter: brightness(1.6); } }
@keyframes surgeBig { 30% { transform: scale(1.15) rotate(-4deg); filter: brightness(2.1); } 60% { transform: scale(.97) rotate(2deg); } }
.risk-halo { display: none; transform-origin: 120px 120px; }
.ring-wrap[data-risk] .risk-halo { display: block; animation: riskPulse var(--rdur, 2s) ease-in-out infinite; }
.ring-wrap[data-risk="5"] > svg, .ring-wrap[data-risk="6"] > svg { animation: tremble .18s linear infinite; }
.ring-wrap[data-risk="6"] .risk-halo { animation: riskPulse .4s ease-in-out infinite, spinHalo 1.2s linear infinite; }
.ring-wrap[data-risk="6"] .risk-halo circle { stroke-dasharray: 10 8; }
@keyframes riskPulse { 0%,100% { opacity: .25; stroke-width: 2; } 50% { opacity: 1; } }
@keyframes spinHalo { to { transform: rotate(360deg); } }
@keyframes tremble { 0%,100% { transform: translate(0,0); } 25% { transform: translate(.8px,-.6px); } 50% { transform: translate(-.7px,.7px); } 75% { transform: translate(.6px,.8px); } }
.ring-center { position: absolute; inset: 15%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2px; }
.bal { font-family: var(--display); font-weight: 900; font-size: clamp(32px, 10.5vw, 46px); line-height: 1; font-variant-numeric: tabular-nums; }
.of { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 5px; align-items: center; }
.streak { margin-top: 8px; font-family: var(--display); font-weight: 800; font-size: 23px; display: flex; gap: 6px; align-items: center; }
.togo { margin-top: 6px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--stroke); font-variant-numeric: tabular-nums; }
.pause-pill { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--pend); }

/* Strips */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); overflow: hidden; margin-top: 8px; }
.stat { padding: 10px 12px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--stroke); }
.k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.v { font-family: var(--display); font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s { font-size: 11px; color: var(--muted); }
.risk-banner { margin-top: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-color: var(--rc); box-shadow: 0 0 22px -10px var(--rc); }
.risk-banner .big { font-size: 26px; }
.risk-banner b { font-family: var(--display); font-size: 20px; letter-spacing: .04em; text-transform: uppercase; color: var(--rc); }
:root[data-skin="light"] .risk-banner b { filter: brightness(.75); }

/* Lists */
.section-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 26px 0 10px; }
.section-h h2 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.section-h span { font-size: 12px; color: var(--muted); text-align: right; }
.list { display: flex; flex-direction: column; gap: 8px; }
.bet { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 10px 12px; }
.ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; background: var(--glass-2); }
.bet.win .ic { background: color-mix(in srgb, var(--win) 18%, transparent); }
.bet.loss .ic { background: color-mix(in srgb, var(--loss) 18%, transparent); }
.bet.pending .ic { background: color-mix(in srgb, var(--pend) 18%, transparent); }
.bet .main { min-width: 0; }
.bet .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bet .m { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.bet .r { text-align: right; font-family: var(--display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.bet .r small { display: block; font-family: var(--body); font-weight: 400; font-size: 11px; color: var(--muted); }
.bet.win .r { color: var(--win); } .bet.loss .r { color: var(--loss); } .bet.pending .r { color: var(--pend); }
.act { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); padding: 4px 6px; }
.act b { color: var(--fg); }
.edited { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; border: 1px solid var(--stroke); border-radius: 6px; padding: 0 5px; color: var(--pend); font-family: var(--body); font-weight: 700; }
.riskchip { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 6px; border: 1px solid var(--rc); color: var(--fg); }
.run-break { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--loss); display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.run-break.ok { color: var(--gold); }
.run-break::before, .run-break::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .35; }
.empty { border: 1px dashed var(--stroke); border-radius: 16px; padding: 22px 16px; color: var(--muted); text-align: center; }

/* FAB + nav */
.fab-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 10px; background: linear-gradient(to top, var(--bg) 35%, transparent); pointer-events: none; }
.fab { pointer-events: auto; display: block; width: 100%; max-width: 528px; margin: 0 auto; border: 0; border-radius: 16px; padding: 14px; font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 30px -10px var(--accent); }
.fab:disabled { background: var(--glass-2); color: var(--muted); box-shadow: none; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--navbg); -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%); border-top: 1px solid var(--stroke); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 560px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .03em; }
.nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button.on { color: var(--fg); }
.nav button.on svg { stroke: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--sheet); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); border-radius: 24px 24px 0 0; border: 1px solid var(--stroke); border-bottom: 0; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-top: 10px; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); animation: up .28s cubic-bezier(.2,.9,.25,1); }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--stroke); margin: 0 auto 12px; }
.sheet h3 { margin: 0 0 4px; font-family: var(--display); font-size: 26px; font-weight: 800; text-wrap: balance; overflow-wrap: anywhere; }
.sheet h4 { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; position: relative; min-width: 0; }
.field label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.field input, .field textarea { width: 100%; background: var(--field); border: 1px solid var(--stroke); border-radius: 12px; padding: 12px 13px; color: var(--fg); font: inherit; font-size: 16px; }
.field textarea { min-height: 90px; font-size: 13px; font-family: ui-monospace, monospace; resize: vertical; }
.field input:disabled { opacity: .55; }
.hint { font-size: 12px; color: var(--muted); }
.err { font-size: 13px; color: var(--loss); min-height: 0; }
.err:not(:empty) { margin-bottom: 10px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; border-radius: 13px; padding: 13px 16px; font-weight: 700; background: var(--fg); color: var(--bg); width: 100%; font-size: 16px; }
.btn.sec { background: var(--glass-2); color: var(--fg); border: 1px solid var(--stroke); }
.btn.warn { background: color-mix(in srgb, var(--loss) 18%, transparent); color: var(--loss); border: 1px solid color-mix(in srgb, var(--loss) 50%, transparent); }
.btn.gold { background: var(--gold); color: #1a1200; }
.btn:disabled { opacity: .45; }
.btns { display: grid; gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--field); padding: 4px; border-radius: 12px; border: 1px solid var(--stroke); }
.seg button { border: 0; background: transparent; padding: 9px 6px; border-radius: 9px; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--glass-2); color: var(--fg); font-weight: 700; box-shadow: 0 1px 0 var(--stroke); }
.preview { background: var(--field); border: 1px solid var(--stroke); border-radius: 12px; padding: 10px 13px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.preview b { font-family: var(--display); font-size: 18px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; background: var(--c); box-shadow: inset 0 0 0 2px var(--sheet); }
.swatches button.on { border-color: var(--fg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--stroke); background: var(--glass); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chip.on { background: var(--fg); color: var(--bg); }

/* Sport picker */
.sugg { position: absolute; top: 100%; left: 0; right: 0; z-index: 3; margin-top: 4px; background: var(--sheet); border: 1px solid var(--stroke); border-radius: 12px; max-height: 236px; overflow-y: auto; box-shadow: 0 16px 40px -10px rgba(0,0,0,.6); }
.sugg button { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: transparent; padding: 11px 13px; border-bottom: 1px solid var(--stroke); font-size: 15px; }
.sugg button:last-child { border-bottom: 0; }
.sugg button.hi, .sugg button:hover { background: var(--glass-2); }
.sugg small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.picked { position: absolute; right: 12px; top: 34px; font-size: 13px; color: var(--win); pointer-events: none; }

/* Bet detail */
.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 16px; }
.results button { border: 1px solid var(--stroke); background: var(--field); border-radius: 14px; padding: 14px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; }
.results button span { font-size: 26px; line-height: 1; }
.results button.on.win { border-color: var(--win); background: color-mix(in srgb, var(--win) 16%, transparent); }
.results button.on.loss { border-color: var(--loss); background: color-mix(in srgb, var(--loss) 16%, transparent); }
.results button.on.pending { border-color: var(--pend); background: color-mix(in srgb, var(--pend) 16%, transparent); }
.results button:disabled { opacity: .35; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.kv > div { background: var(--field); border: 1px solid var(--stroke); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.note { font-size: 12px; color: var(--muted); margin: -8px 0 14px; }
.history li { font-size: 13px; margin-bottom: 6px; overflow-wrap: anywhere; }
.history ul { margin: 0; padding-left: 18px; }
.link { color: var(--accent); overflow-wrap: anywhere; }

/* Overview */
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
.ov-card { padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.ov-card.active { border-color: var(--fg); }
.ov-card svg { width: 96px; height: 96px; }
.ov-card .n { font-family: var(--display); font-weight: 800; font-size: 18px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.ov-card .b { font-family: var(--display); font-weight: 800; font-size: 23px; font-variant-numeric: tabular-nums; }
.ov-card .st { font-size: 13px; color: var(--muted); }
.ov-card.add { justify-content: center; border-style: dashed; color: var(--muted); min-height: 210px; font-weight: 700; }
.ov-card.add span { font-size: 34px; line-height: 1; }

/* Stats */
.card { padding: 14px; margin-bottom: 10px; }
.card h3 { margin: 0 0 2px; font-family: var(--display); font-size: 19px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }
.card .cap { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tile { background: var(--field); border: 1px solid var(--stroke); border-radius: 12px; padding: 9px 11px; min-width: 0; }
.tile .v.win { color: var(--win); } .tile .v.loss { color: var(--loss); } .tile .v.gold { color: var(--gold); }
.bars { display: flex; flex-direction: column; gap: 9px; }
.barrow { display: grid; grid-template-columns: 112px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; }
.barrow .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bartrack { position: relative; height: 12px; border-radius: 6px; background: var(--track); }
.barfill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--win); }
.barexp { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); border-radius: 1px; }
.barrow .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.barrow .num small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--stroke); white-space: nowrap; }
th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
th:first-child, td:first-child { text-align: left; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--body); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.runs { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.runrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; padding: 8px 10px; border-radius: 12px; background: var(--field); border: 1px solid var(--stroke); }
.runrow .play { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 9px; padding: 6px 10px; font-weight: 800; font-size: 12px; flex: none; }
.bigq { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }

/* Awards */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ach { padding: 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ach .e { font-size: 28px; line-height: 1.1; }
.ach .n { font-weight: 800; font-family: var(--display); font-size: 17px; letter-spacing: .02em; }
.ach .d { font-size: 12px; color: var(--muted); }
.ach.locked { opacity: .42; }
.ach.locked .e { filter: grayscale(1); }
.ach.got { border-color: color-mix(in srgb, var(--gold) 55%, transparent); box-shadow: 0 0 22px -12px var(--gold); }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.skin { border: 2px solid var(--stroke); border-radius: 14px; padding: 0; overflow: hidden; background: none; text-align: left; }
.skin.on { border-color: var(--accent); }
.skin .sw { height: 54px; background: var(--sw); position: relative; }
.skin .sw b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; }
.skin .nm { padding: 6px 8px; font-size: 12px; font-weight: 700; }
.skin.locked .sw { filter: saturate(.7) brightness(.85); }
.scan { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.scan button { width: 100% !important; }
.scan .s { flex: 1; min-width: 0; font-size: 13px; }
.scan.busy .s::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-left: 6px; border-radius: 50%; border: 2px solid var(--muted); border-top-color: transparent; animation: spinHalo .8s linear infinite; vertical-align: -1px; }
.pv-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-top: 10px; border-color: var(--accent); font-size: 13px; }
.pv-bar div { flex: 1; min-width: 0; }
.pv-bar button { flex: none; border: 0; border-radius: 10px; padding: 7px 12px; font-weight: 700; background: var(--fg); color: var(--bg); }
.ladder { display: flex; flex-direction: column; gap: 6px; }
.ladder div { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.ladder .no { opacity: .45; }

/* Effects */
.fx { position: fixed; inset: 0; z-index: 40; pointer-events: none; display: grid; place-items: center; }
.stamp { font-size: 120px; line-height: 1; filter: drop-shadow(0 0 30px var(--win)); animation: stamp 1.1s cubic-bezier(.2,1.4,.3,1) forwards; display: flex; flex-direction: column; align-items: center; }
.stamp b { font-family: var(--display); font-size: 46px; font-weight: 900; letter-spacing: .2em; color: var(--win); margin-top: 6px; text-shadow: 0 0 18px var(--win); }
@keyframes stamp { 0% { transform: scale(3) rotate(-25deg); opacity: 0; } 30% { transform: scale(.9) rotate(-8deg); opacity: 1; } 45% { transform: scale(1.05) rotate(-10deg); } 75% { opacity: 1; } 100% { transform: scale(1) rotate(-10deg); opacity: 0; } }
.flash-red { position: fixed; inset: 0; background: radial-gradient(circle, color-mix(in srgb, var(--loss) 40%, transparent), transparent 70%); animation: flash 1.3s forwards; }
@keyframes flash { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
.crack svg { position: fixed; inset: 0; width: 100%; height: 100%; }
.crack path { fill: none; stroke: var(--loss); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px var(--loss)); animation: draw .35s ease-out forwards, fadeOut .5s 1.2s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
.x-mark { font-size: 130px; line-height: 1; animation: xin 1.6s forwards; filter: drop-shadow(0 0 24px var(--loss)); display: flex; flex-direction: column; align-items: center; }
.x-mark b { font-family: var(--display); font-size: 42px; font-weight: 900; letter-spacing: .2em; color: var(--loss); }
@keyframes xin { 0% { transform: scale(2.4); opacity: 0; } 18% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.94); } }
.shake { animation: shake .55s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%,90% { transform: translateX(-2px); } 20%,80% { transform: translateX(5px); } 30%,50%,70% { transform: translateX(-10px) rotate(-.6deg); } 40%,60% { transform: translateX(10px) rotate(.6deg); } }
.glass-fx { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.glass-fx .hg { font-size: 110px; line-height: 1; animation: flip 1.6s ease-in-out forwards; filter: drop-shadow(0 0 22px var(--pend)); }
.glass-fx .rk { font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: .1em; text-transform: uppercase; color: var(--rc); text-shadow: 0 0 18px var(--rc); animation: xin 1.6s forwards; }
@keyframes flip { 0% { transform: rotate(0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: rotate(0) scale(1); } 50% { transform: rotate(180deg); } 80% { transform: rotate(180deg); opacity: 1; } 100% { transform: rotate(180deg) scale(.8); opacity: 0; } }
.tierburst { display: flex; flex-direction: column; align-items: center; gap: 8px; animation: tb var(--tdur, 2.3s) forwards; position: relative; }
.tierburst .rays { position: absolute; width: 560px; height: 560px; left: 50%; top: 42%; translate: -50% -50%; border-radius: 50%; background: repeating-conic-gradient(from 0deg, var(--tc) 0 6deg, transparent 6deg 18deg); -webkit-mask: radial-gradient(circle, #000 15%, transparent 65%); mask: radial-gradient(circle, #000 15%, transparent 65%); opacity: .5; animation: spin var(--tdur, 2.3s) linear; }
.tierburst.cosmic .rays { background: repeating-conic-gradient(from 0deg, #ff5fd2 0 5deg, transparent 5deg 12deg, #3ad6ff 12deg 17deg, transparent 17deg 24deg, var(--tc) 24deg 29deg, transparent 29deg 36deg); opacity: .7; }
.tierburst .sym { font-size: 140px; line-height: 1; position: relative; filter: drop-shadow(0 0 30px var(--tc)); }
.tierburst .lbl { position: relative; font-family: var(--display); font-weight: 900; font-size: 36px; text-transform: uppercase; letter-spacing: .14em; color: var(--tc); text-shadow: 0 0 20px var(--tc); text-align: center; }
.tierburst .lbl small { display: block; font-size: 14px; color: var(--fg); letter-spacing: .3em; }
@keyframes tb { 0% { transform: scale(.2); opacity: 0; } 18% { transform: scale(1.12); opacity: 1; } 28% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
@keyframes spin { to { rotate: 140deg; } }
.screenflash { position: fixed; inset: 0; background: var(--tc); mix-blend-mode: screen; animation: flash .9s forwards; }
canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 45; pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 86px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 50; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; animation: fade .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.ach { background: var(--gold); color: #1a1200; }

/* Replay */
.replay .ring-wrap { width: min(64vw, 260px); }
.replay .now { text-align: center; min-height: 44px; font-size: 14px; }
.replay .now b { font-family: var(--display); font-size: 20px; }
.replay-stamp { position: absolute; top: -4%; right: -4%; font-size: 52px; line-height: 1; pointer-events: none; animation: stamp .9s forwards; }

/* Stats cards and the Customise sheet */
.stat-card { position: relative; }
.stat-card .grp { position: absolute; top: 14px; right: 14px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.minih { margin: 16px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.gauge { position: relative; height: 12px; border-radius: 99px; margin: 6px 0 4px; background: linear-gradient(90deg, var(--loss), color-mix(in srgb, var(--loss) 30%, var(--track)) 30%, var(--track) 38%, var(--track) 62%, color-mix(in srgb, var(--win) 30%, var(--track)) 70%, var(--win)); }
.gauge i { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 3px var(--bg), 0 0 12px var(--fg); transition: left .8s cubic-bezier(.2,.9,.25,1); }
.gauge-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.form { display: flex; flex-wrap: wrap; gap: 4px; }
.form span { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 800 12px var(--display); color: #0b0d10; }
.form .win { background: var(--win); } .form .loss { background: var(--loss); color: #fff; }
.hist { display: flex; align-items: flex-end; gap: 3px; height: 110px; padding-bottom: 16px; }
.hist > div { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; min-width: 0; }
.hist i { display: block; background: var(--loss); border-radius: 4px 4px 1px 1px; min-height: 2px; opacity: .85; }
.hist span { position: absolute; bottom: -16px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }
.run-pick { width: 100%; margin-bottom: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--stroke); background: var(--field); color: var(--fg); font: 600 14px var(--body); }
.sm-actions { display: flex; gap: 6px; margin: 10px 0; }
.sm-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.sm-row { display: flex; align-items: center; gap: 8px; background: var(--field); border: 1px solid var(--stroke); border-radius: 12px; padding: 8px 8px 8px 4px; transition: opacity .2s; }
.sm-row.off { opacity: .55; }
.sm-row.dragging { position: relative; z-index: 2; opacity: 1; box-shadow: 0 12px 28px -10px rgba(0,0,0,.6); border-color: var(--accent); transition: none; }
.sm-grip { flex: none; width: 30px; height: 40px; display: grid; place-items: center; color: var(--muted); font-size: 18px; cursor: grab; touch-action: none; user-select: none; }
.sm-main { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.sm-main input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.sm-main b { display: block; font-size: 14px; }
.sm-main small { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
.sm-arrows { flex: none; display: flex; flex-direction: column; gap: 2px; }
.sm-arrows button { width: 30px; height: 20px; border: 1px solid var(--stroke); background: var(--glass); border-radius: 6px; font-size: 9px; color: var(--muted); }
.sm-arrows button:disabled { opacity: .3; }
/* Header: tracker tabs on the left, your profile photo on the right */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; margin-inline: -4px; padding-inline: 4px; background: linear-gradient(var(--bg) 70%, transparent); }
.topbar .tabs { position: static; flex: 1; min-width: 0; margin: 0; background: none; }
.tab.ic { padding: 7px 9px; }
.tab.ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; display: block; }
.me { flex: none; position: relative; margin: 8px 0 6px auto; padding: 0; border: 0; background: none; border-radius: 50%; }
.me.on .avatar { outline: 2px solid var(--fg); outline-offset: 2px; }
.sync-dot { position: absolute; right: -1px; bottom: 1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg); background: var(--win); transition: background .3s; }
.sync-dot.saving { background: var(--pend); }
.sync-dot.offline { background: var(--muted); }
.sync-dot.error { background: var(--loss); }
body.signed-out .topbar, body.signed-out .nav, body.signed-out .fab-bar { display: none; }

/* Round profile photo, ringed in the live tier's colour, with the streak badge on its top right */
.avatar { position: relative; width: var(--sz); height: var(--sz); border-radius: 50%; flex: none; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--tc) 55%, var(--glass-2)), var(--field)); box-shadow: 0 0 0 2px var(--tc), 0 0 calc(var(--sz) * .18) -2px var(--tc); }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.avatar .initial { font-family: var(--display); font-weight: 900; font-size: calc(var(--sz) * .46); color: var(--fg); }
.avatar.busy img, .avatar.busy .initial { opacity: .35; }
.avatar.busy::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; border: 3px solid var(--fg); border-right-color: transparent; animation: reSpin .8s linear infinite; }
.av-badge { position: absolute; top: 2%; right: -14%; font-size: calc(var(--sz) * .13); padding: 3px 10px 3px 8px; box-shadow: 0 4px 14px -4px rgba(0,0,0,.6); background: var(--sheet); }
.av-edit { position: absolute; right: 2%; bottom: 2%; width: 36%; height: 36%; max-width: 44px; max-height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--fg); color: var(--bg); font-size: 18px; cursor: pointer; box-shadow: 0 0 0 3px var(--bg); }

/* Display name that glows in the live tier's colours */
.glowname { color: var(--fg); text-shadow: 0 0 8px var(--tc), 0 0 22px var(--tc), 0 0 42px var(--tc2); }
.glowname.g-plain { text-shadow: 0 0 10px color-mix(in srgb, var(--tc) 60%, transparent); }
.glowname.g-flame { animation: nameFlicker 1.6s ease-in-out infinite; }
.glowname.g-cosmic { background: linear-gradient(100deg, #fff, var(--tc2), var(--tc), #3ad6ff, #fff); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: flameBg 4s linear infinite; text-shadow: none; filter: drop-shadow(0 0 10px var(--tc)); }
@keyframes nameFlicker { 50% { text-shadow: 0 0 12px var(--tc), 0 0 30px var(--tc), 0 0 60px var(--tc2); } }
:root[data-skin="light"] .glowname { color: color-mix(in srgb, var(--tc) 70%, #000); text-shadow: 0 0 14px color-mix(in srgb, var(--tc) 55%, transparent); }

.profile-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 26px 0 8px; }
.profile-hero h1 { margin: 6px 0 0; font-family: var(--display); font-weight: 900; font-size: 38px; line-height: 1; overflow-wrap: anywhere; }
.subnav { margin: 14px 0 0; }

/* Sign in */
.auth { max-width: 420px; margin: 0 auto; padding-top: max(36px, 6vh); }
.auth h1 { text-align: center; font-family: var(--display); font-weight: 900; font-size: 40px; margin: 8px 0 4px; }
.auth-logo { position: relative; width: 132px; margin: 0 auto; }
.auth-logo svg { width: 100%; display: block; overflow: visible; }
.auth-logo span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; }
.spin-slow { animation: reBreathe 1.6s ease-in-out infinite; }
.linkbtn { display: block; margin: 12px auto 0; border: 0; background: none; color: var(--muted); font-size: 14px; text-decoration: underline; }
.okmsg { font-size: 14px; padding: 10px 12px; border-radius: 12px; background: var(--field); border: 1px solid var(--stroke); margin-bottom: 14px; }
.hint.good { color: var(--win); } .hint.bad { color: var(--loss); }
.toast.bad { background: var(--loss); color: #fff; width: max-content; max-width: min(88vw, 380px); }

/* Coming-soon tabs */
.soon { text-align: center; padding: 26px 18px; }
.soon-ic { font-size: 54px; line-height: 1; margin-bottom: 8px; }
.soon p { margin: 0 0 12px; }
.soon ul { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.soon li { font-size: 13px; padding: 5px 11px; border-radius: 99px; background: var(--field); border: 1px solid var(--stroke); }

/* Friends */
.fsearch { margin: 4px 0 12px; }
.fsearch input { font-size: 16px; }
.flist { padding: 6px 14px; }
.flist > .cap { padding: 10px 0; }
.frow { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.frow + .frow { border-top: 1px solid var(--stroke); }
.fwho { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; }
.fwho .avatar { margin-right: 12px; }
.fwho .av-badge { font-size: 10px; padding: 1px 6px 1px 5px; right: -22%; top: -6%; }
.fname { min-width: 0; display: flex; flex-direction: column; }
.fname b { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 6px 10px; margin: -6px -10px; }
.fname .glowname:not(.g-cosmic) { text-shadow: 0 0 6px var(--tc), 0 0 12px color-mix(in srgb, var(--tc) 60%, transparent); }
.fname small { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fact { flex: none; display: flex; gap: 6px; align-items: center; }
.btn.sm { width: auto; padding: 8px 14px; font-size: 14px; min-height: 0; }
.fstate { font-size: 13px; color: var(--muted); padding: 0 4px; }
.frank { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--muted); }
.fempty { text-align: center; padding: 22px 18px; }
.fempty p { margin: 0 0 10px; }
.has-dot { position: relative; }
.has-dot[data-count]:not([data-count=""])::after { content: attr(data-count); position: absolute; top: 2px; left: 54%; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--loss); color: #fff; font-size: 11px; font-weight: 700; line-height: 17px; text-align: center; box-shadow: 0 0 0 2px var(--bg); }

/* Leaderboard */
.lb-metrics { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
.lb-metrics button { flex: 1; white-space: nowrap; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--stroke); background: var(--field); color: var(--muted); font: 600 13px/1.2 inherit; font-family: inherit; }
.lb-metrics button.on { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.lb-podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; margin: 6px 0 14px; }
.lb-podium.n1 { grid-template-columns: minmax(0, 170px); justify-content: center; } .lb-podium.n2 { grid-template-columns: 1.15fr 1fr; }
.lb-podium.n3 .p1 { order: 2; } .lb-podium.n3 .p2 { order: 1; } .lb-podium.n3 .p3 { order: 3; }
.lb-pod { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 14px 6px 12px; border-radius: 20px; border: 1px solid var(--stroke); background: var(--glass); color: inherit; font: inherit; cursor: pointer; box-shadow: inset 0 1px 0 var(--rim), var(--lift); }
.lb-pod.p1 { padding-top: 22px; background: linear-gradient(180deg, color-mix(in srgb, #f5c518 16%, var(--glass)), var(--glass)); border-color: color-mix(in srgb, #f5c518 45%, var(--stroke)); }
.lb-pod.me { outline: 2px solid var(--fg); outline-offset: -2px; }
.lb-pod .avatar { margin: 4px 0 2px; }
.lb-pod .av-badge { font-size: 11px; padding: 1px 6px 1px 5px; right: -26%; }
.lb-pod b { font-family: var(--display); font-weight: 800; font-size: 17px; max-width: calc(100% + 8px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px; margin: -4px; }
.lb-pod b .glowname:not(.g-cosmic) { text-shadow: 0 0 6px var(--tc), 0 0 12px color-mix(in srgb, var(--tc) 60%, transparent); }
.lb-medal { position: absolute; top: -12px; font-size: 24px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.lb-val { font-family: var(--display); font-weight: 900; font-size: 24px; line-height: 1; }
.lb-pod.p1 .lb-val { font-size: 30px; }
.lb-val small { font-family: var(--body, inherit); font-weight: 500; font-size: 12px; color: var(--muted); }
.lb-row .fwho .avatar { margin-right: 10px; }
.lb-rank { flex: none; width: 24px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--muted); }
.lb-row.me { margin: 0 -14px; padding-inline: 14px; background: color-mix(in srgb, var(--fg) 7%, transparent); }
.lb-row.me + .frow, .frow + .lb-row.me { border-top-color: transparent; }
.lb-score { flex: none; font-family: var(--display); font-weight: 900; font-size: 22px; }
.lb-you { font-style: normal; font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--fg); color: var(--bg); vertical-align: 3px; text-shadow: none; }
/* In tight rows the glow is softer and steady, so it isn't clipped into a box */
.fname .glowname.g-flame, .lb-pod b .glowname.g-flame { animation: none; }
.fname .glowname.g-cosmic, .lb-pod b .glowname.g-cosmic { filter: none; }

/* Chat */
.chat-row { width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.chat-row .avatar { margin-right: 12px; }
.chat-row .fname { flex: 1; }
.chat-row.unread .fname small { color: var(--fg); font-weight: 600; }
.chat-meta { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.chat-meta small { font-size: 12px; color: var(--muted); }
.chat-meta i { font-style: normal; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: #04131a; font-size: 12px; font-weight: 800; line-height: 20px; text-align: center; }
body.in-convo .topbar { display: none; }
.convo-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 6px; margin: 0 -16px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--stroke); }
.convo-head .fwho .avatar { margin-right: 10px; }
.convo-head .av-badge { font-size: 9px; padding: 1px 5px 1px 4px; right: -24%; top: -8%; }
.convo-back { flex: none; width: 36px; height: 40px; border: 0; background: none; color: var(--fg); font-size: 34px; line-height: 1; cursor: pointer; }
.convo { display: flex; flex-direction: column; gap: 4px; padding: 12px 0 calc(var(--nav-h) + 96px); min-height: 50vh; }
.convo-empty { text-align: center; margin: 30px 10px; }
.convo-older { margin: 0 auto 8px; }
.convo-day { align-self: center; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
.msg { position: relative; display: flex; flex-direction: column; max-width: 82%; }
.msg.mine { align-self: flex-end; align-items: flex-end; }
.msg.theirs { align-self: flex-start; align-items: flex-start; }
.bubble { position: relative; padding: 9px 13px 7px; border-radius: 20px; background: var(--glass-2, var(--field)); border: 1px solid var(--stroke); cursor: pointer; overflow-wrap: anywhere; }
.msg.mine .bubble { background: color-mix(in srgb, var(--accent) 22%, var(--field)); border-color: color-mix(in srgb, var(--accent) 45%, var(--stroke)); border-bottom-right-radius: 6px; }
.msg.theirs .bubble { border-bottom-left-radius: 6px; }
.mtext { white-space: pre-wrap; font-size: 15px; line-height: 1.35; }
.mtime { display: block; text-align: right; font-size: 10px; color: var(--muted); margin-top: 2px; }
.mrx { display: flex; gap: 2px; margin-top: -6px; z-index: 1; padding: 1px 5px; border-radius: 99px; background: var(--sheet); border: 1px solid var(--stroke); font-size: 13px; }
.mrx span.me { filter: drop-shadow(0 0 4px var(--accent)); }
.mseen { font-size: 11px; color: var(--muted); margin-top: 2px; }
.rx-pick { position: absolute; bottom: calc(100% + 4px); z-index: 4; display: flex; gap: 2px; padding: 4px 6px; border-radius: 99px; background: var(--sheet); border: 1px solid var(--stroke); box-shadow: 0 10px 30px -8px rgba(0,0,0,.6); animation: up .18s ease-out; }
.msg.mine .rx-pick { right: 0; } .msg.theirs .rx-pick { left: 0; }
.rx-pick button { border: 0; background: none; font-size: 24px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; }
.rx-pick button.on { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.mbet { min-width: 200px; margin: 2px 0 6px; padding: 9px 11px; border-radius: 14px; background: var(--field); border: 1px solid var(--stroke); }
.mbet.win { border-color: color-mix(in srgb, var(--win) 55%, var(--stroke)); } .mbet.loss { border-color: color-mix(in srgb, var(--loss) 55%, var(--stroke)); }
.mbet-top { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); }
.mbet-res { font-weight: 700; color: var(--fg); white-space: nowrap; }
.mbet-text { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.15; margin-top: 3px; }
.mbet-odds { font-size: 13px; color: var(--muted); }
.composer { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 6; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.composer > * { max-width: 560px; margin-left: auto; margin-right: auto; }
.cmp-row { display: flex; align-items: flex-end; gap: 8px; }
.cmp-row textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; padding: 11px 14px; border-radius: 22px; border: 1px solid var(--stroke); background: var(--field); color: var(--fg); font: 16px/1.3 inherit; font-family: inherit; }
.cmp-ic, .cmp-send { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--stroke); background: var(--field); font-size: 20px; cursor: pointer; display: grid; place-items: center; color: var(--fg); }
.cmp-send { background: var(--accent); border-color: transparent; }
.cmp-send svg { width: 20px; height: 20px; fill: #04131a; }
.cmp-send:disabled { opacity: .5; }
.cmp-bet { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; padding: 7px 10px 7px 12px; border-radius: 14px; background: var(--sheet); border: 1px solid var(--stroke); font-size: 13px; }
.cmp-bet span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-bet button { flex: none; border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; }
.pick-bets { display: flex; flex-direction: column; gap: 6px; }
.pick-bet { display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--stroke); background: var(--field); color: inherit; font: inherit; cursor: pointer; }
.pick-bet span:last-child { display: flex; flex-direction: column; min-width: 0; }
.pick-bet b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-bet small { font-size: 12px; color: var(--muted); }
/* Feed */
.subnav .has-dot[data-count]:not([data-count=""])::after { top: 50%; left: auto; right: 10px; transform: translateY(-50%); box-shadow: none; }
.feed-day { display: block; text-align: center; margin: 16px 0 8px; }
.feed-item { position: relative; padding: 12px 14px; border-radius: 18px; margin-bottom: 10px; }
.feed-item.new { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent); }
.feed-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.feed-top .fwho { flex: 0 0 auto; }
.feed-line { flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.feed-line span { min-width: 0; line-height: 1.3; }
.feed-line .glowname.g-flame { animation: none; } .feed-line .glowname.g-cosmic { filter: none; }
.feed-line small { color: var(--muted); font-size: 12px; white-space: nowrap; }
.feed-item .mbet { margin: 0; }
.mbet.bank { border-color: color-mix(in srgb, var(--win) 35%, var(--stroke)); }
.feed-rx { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.rx-chip { padding: 3px 9px; border-radius: 99px; background: var(--field); border: 1px solid var(--stroke); font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
.rx-chip.me { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--field)); }
.rx-add { margin-left: auto; border: 1px solid var(--stroke); background: transparent; color: var(--muted); border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.feed-who { color: var(--muted); font-size: 12px; }
.feed-pick { display: flex; justify-content: space-between; margin-top: 8px; padding: 4px 6px; border-radius: 99px; background: var(--sheet); border: 1px solid var(--stroke); animation: up .18s ease-out; }
.feed-pick button { border: 0; background: none; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
.feed-pick button.on { background: color-mix(in srgb, var(--accent) 25%, transparent); }
.feed-more { width: 100%; margin-top: 4px; }
/* Group chats */
.gav { position: relative; width: var(--sz); height: var(--sz); flex: 0 0 auto; }
.gav .avatar { position: absolute; }
.gav .avatar:first-child { top: 0; left: 0; }
.gav .avatar:nth-child(2) { right: 0; bottom: 0; box-shadow: 0 0 0 2px var(--bg); border-radius: 50%; }
.gav .avatar:only-child { inset: 0; margin: auto; }
.convo-note { align-self: center; max-width: 85%; text-align: center; font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 99px; background: var(--field); margin: 6px 0; }
.msender { font-size: 12px; font-weight: 700; margin: 6px 0 2px 4px; }
.msender .glowname.g-flame { animation: none; } .msender .glowname.g-cosmic { filter: none; }
.pick-people { display: grid; gap: 6px; max-height: 46vh; overflow-y: auto; margin-bottom: 12px; }
.pick-person { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--field); border: 1px solid var(--stroke); cursor: pointer; }
.pick-person input { width: 20px; height: 20px; accent-color: var(--accent); }
.pick-person:has(input:checked) { border-color: var(--accent); }
.gi-rename { display: flex; gap: 8px; } .gi-rename input { flex: 1; min-width: 0; }
.gi-list { margin-bottom: 12px; }
/* Challenges */
.ch-card { padding: 14px; border-radius: 18px; margin-bottom: 10px; }
.ch-card.invite { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent); }
.ch-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.ch-top h3 { margin: 2px 0 0; }
.ch-status { font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; max-width: 55%; }
.ch-card.done .ch-status { color: var(--fg); }
.ch-rows { display: grid; gap: 4px; }
.ch-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 12px; }
.ch-row.mine { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.ch-rank { width: 22px; text-align: center; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.ch-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-name .glowname.g-flame { animation: none; } .ch-name .glowname.g-cosmic { filter: none; }
.ch-score { text-align: right; line-height: 1.1; }
.ch-score b { font-family: var(--display); font-size: 22px; display: block; }
.ch-score small { color: var(--muted); font-size: 11px; }

/* Log a bet button dressed for each unlockable theme */
:root[data-skin="wolf"] .fab:not(:disabled) { background: linear-gradient(135deg, #f1f6ff, #a9bddb 60%, #7f95b8); color: #0d1424; box-shadow: 0 10px 30px -10px rgba(170,200,255,.7), inset 0 1px 0 rgba(255,255,255,.8); }
:root[data-skin="unstoppable"] .fab:not(:disabled) { background: linear-gradient(135deg, #ffb341, #ff5a1f 45%, #c4161c); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); box-shadow: 0 10px 34px -10px #ff4a1a, inset 0 1px 0 rgba(255,220,160,.6); }
:root[data-skin="comet"] .fab:not(:disabled) { background: linear-gradient(135deg, #7ee0ff, #5b7cff 55%, #7a4dff); color: #fff; text-shadow: 0 1px 2px rgba(0,0,30,.35); box-shadow: 0 10px 34px -10px #5b7cff, inset 0 1px 0 rgba(255,255,255,.5); }
:root[data-skin="legend"] .fab:not(:disabled) { background: linear-gradient(110deg, #9c6b14, #ffe08a 30%, #c99526 50%, #fff0b8 68%, #a8751a) 0 0 / 220% 100%; color: #2a1d05; box-shadow: 0 10px 34px -10px #ffcf4a, inset 0 1px 0 rgba(255,250,220,.9); animation: foil 6s ease-in-out infinite; }
:root[data-skin="immortal"] .fab:not(:disabled) { background: linear-gradient(120deg, #6b35ff, #ff4fd8 35%, #38e1ff 70%, #6b35ff) 0 0 / 250% 100%; color: #fff; text-shadow: 0 1px 3px rgba(20,0,40,.45); box-shadow: 0 10px 36px -10px #b04dff, inset 0 1px 0 rgba(255,255,255,.45); animation: foil 9s linear infinite; }
@keyframes foil { 0%, 100% { background-position: 0 0; } 50% { background-position: 100% 0; } }
@media (prefers-reduced-motion: reduce) { .fab { animation: none !important; } }

/* Full-screen from the Home Screen draws under the status bar. Start the page below it,
   so the sticky top bar doesn't slide down over the first thing on each screen. */
.app { padding-top: env(safe-area-inset-top, 0px); }

/* iPhone zooms the whole app in when you double-tap, or when you tap a box whose text is
   under 16px, and stays zoomed, so the edges of every screen get cut off. Stop both. */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@supports (-webkit-touch-callout: none) { input, textarea, select { font-size: max(16px, 1em) !important; } }

/* Chat photos and voice notes */
.cmp-row { gap: 6px; }
.cmp-row .cmp-ic, .cmp-row .cmp-send { width: 40px; height: 40px; font-size: 18px; }
.cmp-row textarea { min-width: 0; min-height: 40px; padding: 9px 13px; }
.cmp-row .cmp-mic[hidden], .cmp-row .cmp-send[hidden] { display: none; }
.cmp-rec { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 2px; }
.cmp-rec[hidden] { display: none; }
.rec-dot { width: 12px; height: 12px; border-radius: 50%; background: #ff4d5e; box-shadow: 0 0 0 0 rgba(255,77,94,.6); animation: recpulse 1.2s infinite; flex: none; }
@keyframes recpulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,94,.6); } 70% { box-shadow: 0 0 0 10px rgba(255,77,94,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,94,0); } }
.rec-time { font-variant-numeric: tabular-nums; font-weight: 700; }
.rec-hint { flex: 1; color: var(--muted); font-size: 13px; }
.bubble.has-photo { padding: 4px 4px 6px; }
.bubble.has-photo .mtext { padding: 4px 9px 0; }
.bubble.has-photo .mtime { padding-right: 8px; }
.mphoto { display: block; width: min(240px, 62vw); max-height: 320px; padding: 0; border: 0; border-radius: 16px; overflow: hidden; background: var(--field); cursor: zoom-in; }
.mphoto img { display: block; width: 100%; height: 100%; object-fit: cover; }
.mphoto img:not([src]) { visibility: hidden; }
.mphoto.broken { cursor: default; display: grid; place-items: center; }
.mphoto.broken::after { content: "Photo unavailable"; color: var(--muted); font-size: 13px; }
.mphoto.broken img { display: none; }
.mvoice { display: flex; align-items: center; gap: 10px; min-width: min(220px, 56vw); padding: 2px 0 4px; }
.mv-play { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: #04131a; font-size: 14px; cursor: pointer; display: grid; place-items: center; }
.mv-bar { flex: 1; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--fg) 20%, transparent); overflow: hidden; }
.mv-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
.mv-dur { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.photo-view { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); animation: fadein .15s; }
.photo-view img { max-width: 100vw; max-height: 100%; object-fit: contain; }
.photo-view button { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.15); color: #fff; font-size: 18px; cursor: pointer; }
@keyframes fadein { from { opacity: 0; } }

/* Hints */
.hint-real { margin-top: 14px; }
.hint-k { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hint-big { display: flex; align-items: center; gap: 14px; margin: 8px 0 12px; }
.hint-big > b { font-size: 40px; line-height: 1; font-weight: 800; color: var(--accent); }
.hint-big span { font-size: 14px; color: var(--muted); }
.hint-big span b { color: var(--fg); }
.hint-streak { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.hint-streak div { background: var(--field); border: 1px solid var(--stroke); border-radius: 12px; padding: 8px 6px; text-align: center; }
.hint-streak b { display: block; font-size: 20px; }
.hint-streak small { color: var(--muted); font-size: 12px; }
.hint-chips { flex-wrap: nowrap; overflow-x: auto; margin: 16px -16px 12px; padding: 0 16px 2px; scrollbar-width: none; }
.hint-chips::-webkit-scrollbar { display: none; }
.hint-chips .chip { flex: none; }
.hint { margin-bottom: 12px; }
.hint-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.hint-h h3 { margin: 0; font-size: 18px; flex: 1; }
.hint-e { font-size: 24px; }
.hint-you { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.hint ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.hint li { display: grid; gap: 1px; padding-left: 14px; position: relative; }
.hint li::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.hint li span { color: var(--muted); font-size: 14px; }
.hint-watch { margin-top: 10px; padding: 9px 11px; border-radius: 12px; font-size: 14px; background: color-mix(in srgb, #f5a524 14%, transparent); border: 1px solid color-mix(in srgb, #f5a524 35%, transparent); }
.hint-foot { margin: 6px 2px 24px; }


/* Home Screen app on iPhone: when a page is shorter than the screen, iOS places the bottom bar
   too high. Making every page at least screen height keeps it at the real bottom (--screen-h is set in JS). */
.app { box-sizing: border-box; min-height: var(--screen-h, 0px); }

/* Top bar: solid page colour out to both screen edges and well above, so no background glow
   shows behind it, even when the page is pulled down. The shadow fills the sides without widening the page. */
.topbar { background: none; isolation: isolate; }
.topbar::before { content: ""; position: absolute; z-index: -1; inset: 0; background: var(--bg); box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(-100vmax -100vmax 0 -100vmax); }

/* No soft colour glow behind the screens: a plain, flat page background. Unlocked themes keep their own scenery. */
.bgfx { background: var(--bg); }
/* Chat header: solid, no see-through blur, and solid above it when the page is pulled down. */
.convo-head { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; isolation: isolate; }
.convo-head::before { content: ""; position: absolute; z-index: -1; inset: 0; background: var(--bg); box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(-100vmax 0 0 0); }
/* iPhone blurs a band just under the status bar in Home Screen apps. Keep the top row below that band
   so photos and names stay sharp (only when the app runs edge to edge under the status bar). */
@supports (padding-top: env(safe-area-inset-top)) {
  .topbar { padding-top: min(26px, env(safe-area-inset-top, 0px)); }
  .convo-head { padding-top: calc(10px + min(26px, env(safe-area-inset-top, 0px))); }
}

/* Bet slip photo on a logged bet */
.slip { display: flex; align-items: center; gap: 12px; width: 100%; margin: -4px 0 16px; padding: 8px; border: 1px solid var(--stroke); border-radius: 14px; background: var(--field); color: inherit; font: inherit; text-align: left; cursor: zoom-in; }
.slip img { width: 52px; height: 68px; flex: none; object-fit: cover; object-position: top; border-radius: 8px; background: var(--stroke); }
.slip img:not([src]) { visibility: hidden; }
.slip span { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.slip small { color: var(--muted); font-size: 12px; }
.slip.broken img { visibility: hidden; }
.slip-add { margin: -4px 0 16px; }

/* Tracker privacy tick in Tracker options */
.vis-row { display: flex; gap: 12px; align-items: flex-start; margin: 4px 0 16px; padding: 12px; border: 1px solid var(--stroke); border-radius: 14px; background: var(--field); cursor: pointer; }
.vis-row input { width: 22px; height: 22px; flex: none; margin: 0; accent-color: var(--accent); }
.vis-row b { display: block; font-size: 14px; }
.vis-row small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); line-height: 1.35; }

/* "Typing…" bubble above the composer */
.typing { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
.tdots { display: inline-flex; gap: 3px; padding: 7px 9px; border-radius: 999px; background: var(--field); border: 1px solid var(--stroke); }
.tdots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: tdot 1.2s infinite ease-in-out; }
.tdots i:nth-child(2) { animation-delay: .15s; } .tdots i:nth-child(3) { animation-delay: .3s; }
@keyframes tdot { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .tdots i { animation: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .stamp, .x-mark, .glass-fx .hg, .glass-fx .rk, .tierburst { animation: fadeQuick 1.2s forwards !important; }
  @keyframes fadeQuick { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
}
